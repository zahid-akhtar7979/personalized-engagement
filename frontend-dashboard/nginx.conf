resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/replay/ {
        set $upstream http://dataset-replay:8081;
        proxy_pass $upstream/api/replay/;
    }
    location /api/recommendations/ {
        set $upstream http://recommendation:8082;
        proxy_pass $upstream/api/recommendations/;
    }
    location /api/dashboard/ {
        set $upstream http://engagement:8083;
        proxy_pass $upstream/api/dashboard/;
    }
    location /api/activity {
        set $upstream http://engagement:8083;
        proxy_pass $upstream/api/activity;
    }
    location /api/analytics {
        set $upstream http://retention-analytics:8084;
        proxy_pass $upstream/api/analytics;
    }
    location /api/ai/ {
        set $upstream http://ai-insights:8085;
        proxy_pass $upstream/api/ai/;
    }
    location /ws/ {
        set $upstream http://engagement:8083;
        proxy_pass $upstream/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
