services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pep
      POSTGRES_PASSWORD: pep123
      POSTGRES_DB: pep
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./migrations/load-data.sql:/docker-entrypoint-initdb.d/03-load-data.sql
      - ${DATA_IMPORT_PATH:-/Users/zahidakhtar/Documents/data}:/import-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pep"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dataset-replay:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: dataset-replay-service
    environment:
      PEP_PORT: "8081"
      PEP_KAFKA_BROKERS: kafka:29092
      PEP_EVENTS_CSV_PATH: /import-data/events.csv
    volumes:
      - ${DATA_IMPORT_PATH:-/Users/zahidakhtar/Documents/data}:/import-data:ro
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy

  recommendation:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: recommendation-service
    environment:
      PEP_PORT: "8082"
      PEP_KAFKA_BROKERS: kafka:29092
      PEP_POSTGRES_DSN: "host=postgres user=pep password=pep123 dbname=pep port=5432 sslmode=disable"
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  engagement:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: engagement-orchestrator
    environment:
      PEP_PORT: "8083"
      PEP_KAFKA_BROKERS: kafka:29092
      PEP_REDIS_ADDR: redis:6379
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  retention-analytics:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: retention-analytics-service
    environment:
      PEP_PORT: "8084"
      PEP_KAFKA_BROKERS: kafka:29092
      PEP_POSTGRES_DSN: "host=postgres user=pep password=pep123 dbname=pep port=5432 sslmode=disable"
      PEP_REDIS_ADDR: redis:6379
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-insights:
    build:
      context: .
      dockerfile: Dockerfile.go
      args:
        SERVICE: ai-insights-service
    environment:
      PEP_PORT: "8085"
      PEP_KAFKA_BROKERS: kafka:29092
      PEP_POSTGRES_DSN: "host=postgres user=pep password=pep123 dbname=pep port=5432 sslmode=disable"
      PEP_REDIS_ADDR: redis:6379
      PEP_USE_MOCK_AI: "true"
      PEP_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8085:8085"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
      args:
        # Empty = same-origin; nginx proxies /api/* and /ws/* to backend containers.
        VITE_REPLAY_URL: ""
        VITE_RECS_URL: ""
        VITE_ENGAGEMENT_URL: ""
        VITE_ANALYTICS_URL: ""
        VITE_AI_URL: ""
        VITE_WS_URL: ""
    ports:
      - "3000:80"
    depends_on:
      dataset-replay:
        condition: service_started
      recommendation:
        condition: service_started
      engagement:
        condition: service_started
      retention-analytics:
        condition: service_started
      ai-insights:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
    name: pep_postgres_data
  redis_data:
    name: pep_redis_data
