apiVersion: v1
kind: Secret
metadata:
  name: ai-insights-secret
  namespace: pep-sit
  labels:
    app: ai-insights
    environment: sit
type: Opaque
stringData:
  PEP_POSTGRES_DSN: "host=CHANGE_ME_POSTGRES_HOST user=CHANGE_ME_USER password=CHANGE_ME_PASSWORD dbname=pep port=5432 sslmode=require"
  PEP_OPENAI_API_KEY: "CHANGE_ME_OPENAI_API_KEY"
