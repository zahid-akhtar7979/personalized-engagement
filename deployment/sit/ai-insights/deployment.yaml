apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-insights
  namespace: pep-sit
  labels:
    app: ai-insights
    environment: sit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-insights
  template:
    metadata:
      labels:
        app: ai-insights
        environment: sit
    spec:
      containers:
        - name: ai-insights
          image: ghcr.io/your-org/pep/ai-insights:sit
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-insights-config
            - secretRef:
                name: ai-insights-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
