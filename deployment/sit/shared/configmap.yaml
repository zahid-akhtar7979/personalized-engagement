apiVersion: v1
kind: ConfigMap
metadata:
  name: pep-shared-config
  namespace: pep-sit
  labels:
    app.kubernetes.io/part-of: personalized-engagement
    environment: sit
data:
  # Replace with your SIT infrastructure endpoints (in-cluster or managed).
  PEP_KAFKA_BROKERS: "pep-kafka.pep-sit.svc.cluster.local:9092"
  PEP_REDIS_ADDR: "pep-redis.pep-sit.svc.cluster.local:6379"
  PEP_OPENAI_MODEL: "gpt-4o-mini"
  PEP_USE_MOCK_AI: "false"
  PEP_EVENTS_CSV_PATH: "/data/events.csv"
  # Container image registry — override via kustomization or CI/CD.
  IMAGE_REGISTRY: "ghcr.io/your-org/pep"
  IMAGE_TAG: "sit"
