apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-insights
  namespace: pep-prod
  labels:
    app: ai-insights
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-insights
  template:
    metadata:
      labels:
        app: ai-insights
        environment: prod
    spec:
      containers:
        - name: ai-insights
          image: ghcr.io/your-org/pep/ai-insights:prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-insights-config
            - secretRef:
                name: ai-insights-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
