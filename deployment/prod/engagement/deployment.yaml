apiVersion: apps/v1
kind: Deployment
metadata:
  name: engagement
  namespace: pep-prod
  labels:
    app: engagement
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: engagement
  template:
    metadata:
      labels:
        app: engagement
        environment: prod
    spec:
      containers:
        - name: engagement
          image: ghcr.io/your-org/pep/engagement:prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
              protocol: TCP
          envFrom:
            - configMapRef:
                name: engagement-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
