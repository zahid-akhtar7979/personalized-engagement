apiVersion: apps/v1
kind: Deployment
metadata:
  name: retention-analytics
  namespace: pep-prod
  labels:
    app: retention-analytics
    environment: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retention-analytics
  template:
    metadata:
      labels:
        app: retention-analytics
        environment: prod
    spec:
      containers:
        - name: retention-analytics
          image: ghcr.io/your-org/pep/retention-analytics:prod
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          envFrom:
            - configMapRef:
                name: retention-analytics-config
            - secretRef:
                name: retention-analytics-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
