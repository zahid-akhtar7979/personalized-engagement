apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: pep-prod
  labels:
    app: frontend
    environment: prod
  annotations:
    # Adjust for your ingress controller (nginx, traefik, ALB, etc.).
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: pep.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  # tls:
  #   - hosts:
  #       - pep.example.com
  #     secretName: pep-prod-tls
